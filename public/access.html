<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>进入学习图鉴</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 75% 15%,#273138 0,transparent 55%),#090d10;color:#f5f5f3;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:24px}main{width:min(430px,100%);padding:44px 34px;border-radius:28px;background:#ffffff06;border:1px solid #ffffff25;box-shadow:inset 0 1px #ffffff20,0 35px 100px #0005;backdrop-filter:blur(18px)}small{color:#a8b8c5;font-size:13px;letter-spacing:2px}h1{font-size:34px;letter-spacing:-1px;margin:22px 0 12px;font-weight:600}p{color:#b0bdc6;line-height:1.9;font-size:15px}label{display:block;margin:28px 0 10px;font-size:14px}input{display:block;width:100%;border:1px solid #ffffff30;border-radius:13px;padding:16px;background:#0002;color:white;font:inherit;font-size:18px;outline:none}input:focus{border-color:#bbcedc;box-shadow:0 0 0 3px #bccddd15}button{margin-top:18px;width:100%;border:0;border-radius:100px;padding:15px;font:inherit;background:#e9eef1;color:#172029;cursor:pointer}button:disabled{opacity:.6}#message{color:#ead1ac;font-size:14px;min-height:24px}footer{font-size:12px;color:#8295a4;margin-top:25px;line-height:1.8}</style></head><body><main><small>AI LEARNING ATLAS</small><h1>好奇心，从这里开始</h1><p>输入访问密码，进入你的学习空间。</p><form id="entry"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="128" autofocus><button id="submit" type="submit">进入学习图鉴 →</button><p id="message" role="status" aria-live="polite"></p></form><footer>会用 AI，更会判断<br>11 个关卡 · AI 教练 · 学习复盘</footer></main><script>
const form=document.getElementById('entry'),button=document.getElementById('submit'),message=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='正在验证…';try{const response=await fetch('/ai-learning/api/access/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'暂时无法进入，请稍后重试。');const raw=new URLSearchParams(location.search).get('next')||'/';const target=raw.replace(/^\/ai-learning(?=\/|$)/,'');const valid=/^\/(?:\?(?:[^#]*))?$/.test(target)||/^\/(?:explore|review|coach|learn\/(?:[1-9]|10|11))\/?(?:\?[^#]*)?$/.test(target);location.replace('/ai-learning'+(valid?target:'/'));}catch(error){message.textContent=error instanceof Error?error.message:'请稍后重试。';button.disabled=false;}});
</script></body></html>
