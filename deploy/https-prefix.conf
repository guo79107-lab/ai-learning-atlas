# This file is included only in the existing HTTPS IP virtual host.
# The original application's locations and the planet virtual hosts are unchanged.
location = /ai-learning { return 301 /ai-learning/; }
location ^~ /ai-learning/ {
    proxy_pass http://127.0.0.1:18425/;
    proxy_set_header Host $host;
    proxy_set_header X-Atlas-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
