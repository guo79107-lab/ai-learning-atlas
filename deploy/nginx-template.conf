# Isolated staging listener; switch only this site's listener when publishing.
server {
    listen 127.0.0.1:18425;
    server_name _;
    root /opt/ai-learning-atlas/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json text/x-component image/svg+xml;
    gzip_min_length 1024;
    location ~ \.rsc$ {
        types { }
        default_type text/x-component;
        add_header X-Vinext-RSC-Compatibility-Id "__COMPATIBILITY_ID__" always;
        add_header Vary RSC always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = / {
        if ($http_rsc = "1") { rewrite ^ /index.rsc last; }
        add_header Vary RSC always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location ~ ^/(explore|learn/(?:[1-9]|10|11))/?$ {
        set $atlas_page $1;
        if ($http_rsc = "1") { rewrite ^ /$atlas_page.rsc last; }
        add_header Vary RSC always;
        add_header Cache-Control "no-cache" always;
        try_files /$atlas_page.html =404;
    }
    location /_next/ { try_files $uri =404; expires 7d; }
    location /posters/ { try_files $uri =404; add_header Cache-Control "no-cache" always; }
    location = /curiosity.mp4 { try_files $uri =404; gzip off; expires 1d; }
    location / { try_files $uri =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
