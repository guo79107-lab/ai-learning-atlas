# Isolated staging listener; switch only this site's listener when publishing.
server {
    listen 127.0.0.1:18425;
    server_name _;
    root /opt/ai-learning-atlas/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    auth_request /_atlas_auth;
    absolute_redirect off;
    error_page 401 = @atlas_login;
    location @atlas_login {
        auth_request off;
        return 302 /ai-learning/access?next=$request_uri;
    }
    location @atlas_api_locked {
        auth_request off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"error":"访问已到期，请重新输入网站密码。","locked":true}';
    }
    location = /_atlas_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:18426/api/access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /access {
        auth_request off;
        add_header Cache-Control "no-store" always;
        try_files /access.html =404;
    }
    location = /access.html {
        auth_request off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /api/access/unlock {
        auth_request off;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:18426;
        proxy_set_header X-Real-IP $http_x_atlas_client_ip;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }
    gzip on;
    gzip_types text/css application/javascript application/json text/x-component image/svg+xml;
    gzip_min_length 1024;
    location ^~ /api/ {
        error_page 401 = @atlas_api_locked;
        client_max_body_size 32k;
        client_body_timeout 15s;
        proxy_pass http://127.0.0.1:18426;
        proxy_set_header X-Real-IP $http_x_atlas_client_ip;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
    location ~ \.rsc$ {
        types { }
        default_type text/x-component;
        add_header X-Vinext-RSC-Compatibility-Id "__COMPATIBILITY_ID__" always;
        add_header Vary RSC always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = / {
        if ($http_rsc = "1") { rewrite ^ /index.rsc last; }
        add_header Vary RSC always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location ~ ^/(explore|review|coach|learn/(?:[1-9]|10|11))/?$ {
        set $atlas_page $1;
        if ($http_rsc = "1") { rewrite ^ /$atlas_page.rsc last; }
        add_header Vary RSC always;
        add_header Cache-Control "no-cache" always;
        try_files /$atlas_page.html =404;
    }
    location /_next/ { try_files $uri =404; expires 7d; }
    location /posters/ { try_files $uri =404; add_header Cache-Control "no-cache" always; }
    location = /curiosity.mp4 { try_files $uri =404; gzip off; expires 1d; }
    location / { try_files $uri =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
